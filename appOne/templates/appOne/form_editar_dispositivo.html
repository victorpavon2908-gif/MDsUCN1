<h3 style="margin-bottom:15px;">
    Editar dispositivo
</h3>

<form method="POST"
      enctype="multipart/form-data"
      action="{% url 'editar_dispositivo' dispositivo.id %}">

    {% csrf_token %}

    <div class="formulario">

        {{ form.nombre_dispositivo }}
        {{ form.codigo_inventario }}
        {{ form.marca }}
        {{ form.descripcion }}
        {{ form.imagen }}

        <button type="submit" class="btn-enviar">
            Guardar cambios
        </button>

        <button type="button"
                onclick="cerrarModalEditar()"
                class="btn-eliminar"
                style="margin-top:10px;width:100%;">
            Cancelar
        </button>

    </div>
</form>
