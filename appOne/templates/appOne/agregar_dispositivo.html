{% extends "appOne/dashboard.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'appOne/css/add_dispositivos.css' %}">
{% endblock %}

{% block contenido %}

<h2 class="titulo-form">Agregar dispositivo</h2>

<form method="POST" enctype="multipart/form-data" class="formulario-contenedor">
    {% csrf_token %}

    <div class="formulario-grid">
        {{ form.as_p }}
    </div>

    <button type="submit" class="btn-guardar">
        <i class="ri-save-3-line"></i> Guardar
    </button>
</form>

{% endblock %}
