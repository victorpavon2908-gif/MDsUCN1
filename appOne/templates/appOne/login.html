<!doctype html>
<html lang="es">

<head>
    {% load static %}
    <meta charset="utf-8">
    <title>Formulario de Acceso</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css?family=Nunito&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Overpass&display=swap" rel="stylesheet">

    <!-- Conexión al CSS con Django -->

    <link rel="stylesheet" href="{% static 'appOne/css/login.css'%}">
</head>

<body>

    <div class="bg-overlay"></div>

    <div class="login-box">
        <img src="https://uploads.onecompiler.io/43nzu6ce2/43x5tpdyg/ss.png" alt="logo-login">

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Correo Institucional" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>

        {% if messages %}
        <div class="mensajes">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <div class="pie-form">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="{% url 'registro' %}">Crear una cuenta</a>
        </div>
    </div>

</body>

</html>
