<!doctype html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="utf-8">
    <title>Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'appOne/css/login.css'%}">
</head>

<body>

<div class="login-container">

    <!-- PANEL IZQUIERDO (branding) -->
    <div class="login-left">
        <h1>MDsUCN</h1>
        <p>Gestiona dispositivos, usuarios y préstamos de forma profesional.</p>
    </div>

    <!-- PANEL DERECHO -->
    <div class="login-right">

        <div class="login-box">

            <h2>Iniciar Sesión</h2>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="input-group">
                    <i class="ri-mail-line"></i>
                    <input type="text" name="username" placeholder="Correo institucional" required>
                </div>

                <div class="input-group">
                    <i class="ri-lock-line"></i>
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn-login">
                    Ingresar
                </button>

            </form>

            {% if messages %}
            <div class="mensajes">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <div class="extras">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="{% url 'registro' %}">Crear cuenta</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
